.hs:hover::before { background: var(--red); } .hs span { position: absolute; left: 44px; white-space: nowrap; padding: 5px 13px; border-radius: 999px; background: rgba(18, 14, 15, .82); font-weight: 500; font-size: .95rem; } .hs.l span { left: auto; right: 44px; }

.pn { position: absolute; z-index: 3; right: 0; top: 0; bottom: 0; width: min(440px, 100%); padding: 100px clamp(22px, 2.6vw, 40px) 30px; background: rgba(18, 14, 15, .66); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); translate: 102% 0; visibility: hidden; transition: translate .6s cubic-bezier(.2, .8, .2, 1), visibility 0s .6s; display: flex; flex-direction: column; gap: 18px; } .open .pn { translate: 0 0; visibility: visible; transition-delay: 0s; }
.pn h2 { font: 700 clamp(2rem, 3.2vw, 3.2rem)/.96 var(--d); letter-spacing: -.06em; } .pn p { color: var(--dim); } .pn ul { display: grid; gap: 10px; overflow-y: auto; } .pn li a { display: grid; grid-template-columns: 66px 1fr auto; align-items: center; gap: 14px; padding: 8px; border-radius: 16px; background: rgba(255, 255, 255, .08); line-height: 1.3; } .pn li a:hover { background: rgba(255, 255, 255, .16); } .pn li img { width: 66px; height: 66px; object-fit: contain; background: #fff; border-radius: 11px; } .pn li b { white-space: nowrap; font-weight: 500; } .pn .row { margin-top: auto; } .x { position: absolute; right: 18px; top: 78px; width: 52px; height: 52px; font-size: 1.8rem; border-radius: 50%; }
.nx { position: absolute; z-index: 3; left: var(--pad); bottom: 30px; display: flex; gap: 8px; flex-wrap: wrap; opacity: 0; pointer-events: none; transition: opacity .3s; max-width: calc(100% - 500px); } .open .nx { opacity: 1; pointer-events: auto; } .nx button { min-height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(18, 14, 15, .62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .24); } .nx button:hover { background: #fff; color: #120e0f; } .nx button[aria-current=true] { background: var(--red); border-color: var(--red); color: #fff; }
.duo { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1vw, 16px); padding: clamp(8px, 1vw, 16px); } .duo a { position: relative; aspect-ratio: 4 / 5; border-radius: 26px; overflow: clip; background: var(--tone); padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; isolation: isolate; } .duo a::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(60% 46% at 50% 38%, rgba(255, 255, 255, .34), transparent 72%); } .duo img { position: absolute; left: 50%; top: 40%; translate: -50% -50%; width: 94%; height: 58%; object-fit: contain; filter: drop-shadow(0 22px 20px rgba(0, 0, 0, .42)); transition: scale .6s cubic-bezier(.2, .8, .2, 1); } .duo a:hover img { scale: 1.06; } .duo b { font: 600 clamp(1.15rem, 1.6vw, 1.6rem)/1.08 var(--d); letter-spacing: -.04em; } .duo span { margin-top: 5px; color: rgba(255, 255, 255, .86); } .duo h2 { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: clamp(34px, 5vw, 76px) calc(var(--pad) - 16px) 10px; font: 700 clamp(2.2rem, 5.4vw, 5.6rem)/.92 var(--d); letter-spacing: -.065em; } .duo h2 a { all: unset; cursor: pointer; font: 400 1.05rem/1.3 var(--t); letter-spacing: 0; text-decoration: underline; text-underline-offset: 6px; white-space: nowrap; }

</style></head><body>
<section class="lab" id="lab"><div class="film" id="film"><img id="still" alt="Акордеон Scandalli"></div><h1>Акордеон<br>Центр</h1><p class="lead">Торкніться вузла інструмента, і камера долетить до нього.</p><a class="btn cta" data-u="/c/43">Обрати інструмент</a>
<div class="nx" id="nx" aria-label="Інші вузли"></div>
<aside class="pn" id="pn" aria-live="polite"><button class="x" aria-label="Назад до інструмента" id="x">×</button><h2 id="ph"></h2><p id="pp"></p><ul id="pl"></ul><div class="row"><a class="btn" id="pb">Усі деталі</a></div></aside></section>
<section class="duo" id="duo"><h2>Інструменти <a data-u="/c/43" id="all"></a></h2></section>
<script src="data/slugs.js"></script><script src="site.js"></script><script src="i18n.js"></script><script src="data/catalog.js"></script><script src="data/catalog-i18n.js"></script><script src="data/specs.js"></script><script src="nova/common.js"></script>
<script>
{ const { $, $$, el, I, cat, catId, inCat, L, calm } = PROTO, lab = $('#lab'), film = $('#film');
  const portrait = matchMedia('(max-aspect-ratio: 1/1)').matches, K = portrait ? 'm' : 'd', FW = portrait ? 1088 : 1920, FH = portrait ? 1920 : 1088, V = 'scenes/fly/web/';
  $('#still').src = `${V}start_${K}.webp`;
  // точки: частка кадру; для телефона кадр інший, тому координати свої (tools/fly.py start)
  // точки в пікселях вирізаного фото виробника (1727×1228); де воно лежить у кадрі — tools/fly_frames.py → frames.json
  const PLACE = { d: [.194792, .154412, .55, .690257], m: [.034926, .282812, .930147, .374479] }[K];
  const H = [['buttons', 5, 280, 690, 'l'], ['registers', 26, 470, 640, 'l'], ['grille', 19, 690, 900, ''], ['bellows', 11, 1211, 330, ''], ['bass', 7, 1520, 690, ''], ['strap', catId(/^Ремені/i), 420, 130, 'l']].map(([k, id, x, y, side]) => { const c = id && cat(id); return c && c.n ? { k, c, side, x: PLACE[0] + x / 1727 * PLACE[2], y: PLACE[1] + y / 1228 * PLACE[3] } : null; }).filter(Boolean);
  for (const h of H) { h.b = el('button', { className: `hs ${h.side}`, ariaLabel: h.c.name, onclick: () => fly(h) }, el('span', {}, h.c.name)); lab.append(h.b); $('#nx').append(h.n = el('button', { onclick: () => swap(h) }, h.c.name)); }
  const place = () => { const W = lab.clientWidth, Hh = lab.clientHeight, s = Math.max(W / FW, Hh / FH), ox = (W - FW * s) / 2, oy = (Hh - FH * s) / 2; for (const h of H) { h.b.style.left = `${ox + h.x * FW * s}px`; h.b.style.top = `${oy + h.y * FH * s}px`; } };
  addEventListener('resize', place); place();
  const src = (k, back) => `${V}${k}_${K}${back ? '_back' : ''}.mp4`, cache = new Map();
  const load = (k, back) => { const u = src(k, back); if (!cache.has(u)) cache.set(u, new Promise((ok, bad) => { const v = el('video', { muted: true, preload: 'auto' }); v.setAttribute('playsinline', ''); v.oncanplaythrough = () => ok(v); v.onerror = bad; v.src = u; film.append(v); v.load(); })); return cache.get(u); };
  // прольоти тягнемо наперед, щойно людина торкнулась сторінки
  let warm = false; const heat = () => { if (warm) return; warm = true; (async () => { for (const h of H) { await load(h.k).catch(() => {}); } })(); };
  for (const e of ['pointermove', 'touchstart', 'scroll', 'keydown']) addEventListener(e, heat, { once: true, passive: true });
  let cur = null, busy = false;
  const play = v => new Promise(ok => { v.currentTime = 0; const show = () => { $$('video', film).forEach(x => x.classList.toggle('on', x === v)); }; v.onended = ok; v.play().then(() => requestAnimationFrame(() => requestAnimationFrame(show))).catch(() => { v.currentTime = 1e3; show(); ok(); }); });
  const fill = h => { $('#ph').textContent = h.c.name; $('#pp').textContent = h.c.goods; $('#pb').href = h.c.url; $('#pl').replaceChildren(...h.c.items.map(i => el('li', {}, el('a', { href: i.url }, el('img', { src: i.img, alt: '' }), el('span', {}, i.name), el('b', {}, i.price))))); H.forEach(o => o.n.setAttribute('aria-current', o === h)); };
  async function fly(h) { if (busy) return; busy = true; h.b.classList.add('busy'); const v = await load(h.k).catch(() => null); h.b.classList.remove('busy'); lab.classList.add('fly'); fill(h); if (v && !calm) { const p = play(v); setTimeout(() => lab.classList.add('open'), Math.max(0, v.duration * 1000 - 550)); await p; } else { if (v) { v.currentTime = 1e3; $$('video', film).forEach(x => x.classList.toggle('on', x === v)); } } lab.classList.add('open'); film.classList.add('rest'); cur = h; busy = false; load(h.k, true).catch(() => {}); $('#x').focus({ preventScroll: true }); }
  async function close() { if (busy || !cur) return; busy = true; const h = cur; lab.classList.remove('open'); film.classList.remove('rest'); const v = await load(h.k, true).catch(() => null); if (v && !calm) await play(v); $$('video', film).forEach(x => x.classList.remove('on')); lab.classList.remove('fly'); cur = null; busy = false; }
  async function swap(h) { if (h === cur || busy) return; await close(); await fly(h); }
  $('#x').onclick = close; addEventListener('keydown', e => { if (e.key === 'Escape') close(); }); film.addEventListener('click', close);
  $('#all').textContent = `Усі ${L.goods(inCat(43).length)}`; $('#all').setAttribute('href', PROTO.url('/c/43'));
  for (const x of I.slice(0, 4)) { const a = el('a', { href: x.url }, el('img', { src: x.src, alt: '', loading: 'lazy' }), el('b', {}, `${x.b} ${x.n}`), el('span', {}, x.price)); a.style.setProperty('--tone', x.tone); $('#duo').append(a); } }
</script></body></html>
