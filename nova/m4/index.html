<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><base href="/accordion-lviv-site/"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="nova/common.css">
<style>
/* Розбір: сам акордеон і є каталогом. Торкнись вузла — камера наїжджає й показує деталі до нього. */
.lab { position: relative; height: 100svh; min-height: 660px; overflow: clip; isolation: isolate; background: radial-gradient(46% 58% at 50% 52%, #74645d, #3a2f2c 46%, var(--night) 88%); }

.lab .cta { position: absolute; z-index: 1; right: var(--pad); bottom: clamp(28px, 5svh, 52px); transition: opacity .35s; }
.rig { position: absolute; z-index: 0; left: 50%; top: 52%; height: 112%; aspect-ratio: 16 / 9; translate: -67.5% -52%; transition: transform 1s cubic-bezier(.2, .8, .2, 1); transform-origin: var(--ox, 68%) var(--oy, 52%); } .rig img { width: 100%; height: 100%; }
.hs { position: absolute; translate: -50% -50%; width: 48px; height: 48px; display: grid; place-items: center; z-index: 2; transition: opacity .3s; } .hs::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 7px rgba(255, 255, 255, .26), 0 4px 16px rgba(0, 0, 0, .6); transition: .25s; } .hs::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 1.5px solid #fff; animation: ping 2.4s ease-out infinite; } @keyframes ping { from { scale: .55; opacity: .9; } to { scale: 1.5; opacity: 0; } }
.hs:hover::before, .hs.on::before { background: var(--red); } .hs span { position: absolute; left: 44px; white-space: nowrap; padding: 5px 13px; border-radius: 999px; background: rgba(18, 14, 15, .82); font-weight: 500; font-size: .95rem; } .hs.l span { left: auto; right: 44px; }
.zoom .hs { opacity: 0; pointer-events: none; } .zoom .lead, .zoom .cta { opacity: 0; pointer-events: none; } .zoom h1 { opacity: 0; translate: -20px 0; }
.pn { position: absolute; z-index: 3; right: 0; top: 0; bottom: 0; width: min(460px, 100%); padding: 100px clamp(22px, 2.6vw, 40px) 30px; background: rgba(18, 14, 15, .72); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); translate: 102% 0; transition: translate .6s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column; gap: 18px; } .zoom .pn { translate: 0 0; } .pn h2 { font: 700 clamp(2rem, 3.2vw, 3.2rem)/.96 var(--d); letter-spacing: -.06em; } .pn p { color: var(--dim); }
.pn ul { display: grid; gap: 10px; overflow-y: auto; } .pn li a { display: grid; grid-template-columns: 66px 1fr auto; align-items: center; gap: 14px; padding: 8px; border-radius: 16px; background: rgba(255, 255, 255, .07); line-height: 1.3; } .pn li a:hover { background: rgba(255, 255, 255, .15); } .pn li img { width: 66px; height: 66px; object-fit: contain; background: #fff; border-radius: 11px; } .pn li b { white-space: nowrap; font-weight: 500; } .pn .row { display: flex; gap: 12px; margin-top: auto; } .x { position: absolute; right: 22px; top: 84px; width: 48px; height: 48px; font-size: 1.7rem; }
.dots { position: absolute; z-index: 4; left: 50%; bottom: 24px; translate: -50% 0; display: none; gap: 8px; }
.duo { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1vw, 16px); padding: clamp(8px, 1vw, 16px); } .duo a { position: relative; aspect-ratio: 4 / 5; border-radius: 26px; overflow: clip; background: var(--tone); padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; isolation: isolate; } .duo a::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(60% 46% at 50% 38%, rgba(255, 255, 255, .34), transparent 72%); } .duo img { position: absolute; left: 50%; top: 40%; translate: -50% -50%; width: 94%; height: 58%; object-fit: contain; filter: drop-shadow(0 22px 20px rgba(0, 0, 0, .42)); transition: scale .6s cubic-bezier(.2, .8, .2, 1); } .duo a:hover img { scale: 1.06; } .duo b { font: 600 clamp(1.15rem, 1.6vw, 1.6rem)/1.08 var(--d); letter-spacing: -.04em; } .duo span { margin-top: 5px; color: rgba(255, 255, 255, .86); } .duo h2 { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: clamp(34px, 5vw, 76px) calc(var(--pad) - 16px) 10px; font: 700 clamp(2.2rem, 5.4vw, 5.6rem)/.92 var(--d); letter-spacing: -.065em; } .duo h2 a { all: unset; cursor: pointer; font: 400 1.05rem/1.3 var(--t); letter-spacing: 0; text-decoration: underline; text-underline-offset: 6px; white-space: nowrap; }

</style></head><body>
<section class="lab" id="lab"><h1>Акордеон<br>Центр</h1><p class="lead">Торкніться вузла інструмента, і ми покажемо деталі до нього.</p><a class="btn cta" data-u="/c/43">Обрати інструмент</a>
<div class="rig" id="rig"><img src="scenes/web/open-da.webp" alt="Акордеон Scandalli"></div>
<aside class="pn" id="pn" aria-live="polite"><button class="x" aria-label="Закрити" id="x">×</button><h2 id="ph"></h2><p id="pp"></p><ul id="pl"></ul><div class="row"><a class="btn" id="pb">Усі деталі</a></div></aside></section>
<section class="duo" id="duo"><h2>Інструменти <a data-u="/c/43" id="all"></a></h2></section>
<script src="data/slugs.js"></script><script src="site.js"></script><script src="i18n.js"></script><script src="data/catalog.js"></script><script src="data/catalog-i18n.js"></script><script src="data/specs.js"></script><script src="nova/common.js"></script>
<script>
{ const { $, $$, el, I, cat, catId, inCat, L } = PROTO, lab = $('#lab'), rig = $('#rig');
  const H = [[5, .515, .62, 'l'], [26, .592, .46, 'l'], [31, .655, .55, ''], [11, .745, .34, ''], [7, .845, .52, ''], [catId(/^Ремені/i), .565, .29, 'l'], [19, .70, .63, '']];
  for (const [id, x, y, side] of H) { if (!id) continue; const c = cat(id); if (!c.n) continue; const b = el('button', { className: `hs ${side}`, ariaLabel: c.name, onclick: () => open(c, x, y) }, el('span', {}, c.name)); b.style.left = `${x * 100}%`; b.style.top = `${y * 100}%`; rig.append(b); }
  function open(c, x, y) { $('#ph').textContent = c.name; $('#pp').textContent = c.goods; $('#pb').href = c.url; $('#pl').replaceChildren(...c.items.map(i => el('li', {}, el('a', { href: i.url }, el('img', { src: i.img, alt: '' }), el('span', {}, i.name), el('b', {}, i.price)))));
    rig.style.setProperty('--ox', `${x * 100}%`); rig.style.setProperty('--oy', `${y * 100}%`); const m = innerWidth <= 860, r = rig.getBoundingClientRect(), tx = innerWidth * (m ? .5 : .34) - (r.left + r.width * x), ty = innerHeight * (m ? .26 : .5) - (r.top + r.height * y - lab.getBoundingClientRect().top); rig.style.transform = `translate(${tx}px, ${ty}px) scale(${m ? 1.9 : 2.1})`; lab.classList.add('zoom'); $('#x').focus({ preventScroll: true }); }
  const close = () => { rig.style.transform = ''; lab.classList.remove('zoom'); }; $('#x').onclick = close; addEventListener('keydown', e => { if (e.key === 'Escape') close(); }); rig.addEventListener('click', e => { if (lab.classList.contains('zoom') && !e.target.closest('.hs')) close(); });
  $('#all').textContent = `Усі ${L.goods(inCat(43).length)}`; $('#all').setAttribute('href', PROTO.url('/c/43'));
  for (const x of I.slice(0, 4)) { const a = el('a', { href: x.url }, el('img', { src: x.src, alt: '', loading: 'lazy' }), el('b', {}, `${x.b} ${x.n}`), el('span', {}, x.price)); a.style.setProperty('--tone', x.tone); $('#duo').append(a); } }
</script></body></html>
